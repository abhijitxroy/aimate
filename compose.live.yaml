services:
  aimate:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      AIMATE_DEMO: "0"
      AIMATE_ENV: production
      AIMATE_DEV_LOGIN: "0"
      APP_PASSWORD: ${APP_PASSWORD:?Set a workspace password of at least 12 characters}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set the HTTPS origin of your reverse proxy}
      APP_DATA_DIR: /app/.data
    volumes:
      - live-data:/app/.data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  live-data:
