name: Integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run backend, API, storage and mocked-provider integrations
        run: python tools/run_test_suite.py integration
      - name: Measure bounded read scheduling
        run: python tools/benchmark_reads.py --output read-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: read-benchmark-${{ matrix.os }}
          path: read-benchmark.json
          retention-days: 14
