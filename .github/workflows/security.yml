name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check editor dependency vulnerabilities
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          pnpm --dir frontend audit --prod --audit-level high
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pip-audit>=2.9,<3"
      - name: Fail on known dependency vulnerabilities
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          retention-days: 14
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified open source Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error "$base/$archive" --output "$archive"
          curl --fail --location --silent --show-error "$base/gitleaks_8.30.1_checksums.txt" --output checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" gitleaks
      - name: Fail on secrets in committed history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all" --report-format json --report-path gitleaks-report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redacted-secret-scan
          path: gitleaks-report.json
          retention-days: 14
