name: AiMate Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app/static/**
      - pages/**
      - tools/build_pages.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package the AiMate interface only
        run: python tools/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for uploaded artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" "$ARTIFACTS_URL" \
              | python -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if any(a["name"]=="github-pages" and not a["expired"] for a in data["artifacts"]) else 1)'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The uploaded Pages artifact is not yet available."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
