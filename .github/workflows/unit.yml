name: Unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run isolated Python unit tests
        run: python tools/run_test_suite.py unit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run rendering, security and Pages-preview unit tests
        run: node --test tests/markdown.test.cjs tests/syntax.test.cjs tests/pages-preview.cjs tests/composer_formats.test.cjs tests/recent_chats.test.cjs tests/theme_catalog.test.cjs tests/latest_model_choices.test.cjs
