<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your code, issues and builds in one conversation. Try AiMate's interactive sample demo.">
  <meta name="theme-color" content="#0b1929">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'self'; form-action 'self'">
  <title>AiMate</title>
  <link rel="icon" href="assets/favicon.svg?v=am1" type="image/svg+xml">
  <link rel="stylesheet" href="assets/showcase.css">
  <script src="assets/showcase.js" defer></script>
</head>
<body>
  <header class="nav wrap">
    <a class="brand" href="./" aria-label="AiMate home"><img class="brand-icon" src="assets/favicon.svg" alt="">AiMate</a>
    <a class="repo-link" href="https://github.com/abhijitxroy/aimate">GitHub <span aria-hidden="true">↗</span></a>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="heroTitle">
      <h1 id="heroTitle">Your project.<br><span>One conversation.</span></h1>
      <p>Code, issues and builds. Connected.</p>
    </section>
    <section class="workspace" id="demo" aria-label="Interactive AiMate demo">
      <div class="workspace-header">
        <div class="source-list" aria-label="Sample sources"><span>GitHub</span><span>Jira</span><span>Jenkins</span></div>
        <div class="workspace-controls">
          <span class="demo-chip">Sample demo</span>
          <button class="reset-button" id="resetDemo" type="button" aria-label="Reset demo" title="Reset demo">↺</button>
        </div>
      </div>
      <div class="conversation" id="conversation" role="log" aria-label="Demo conversation" aria-live="polite">
        <div class="welcome" id="demoWelcome">
          <span class="welcome-symbol" aria-hidden="true">✳</span>
          <h2>What are we working on?</h2>
        </div>
      </div>
      <div class="demo-bottom">
        <div class="suggestions" aria-label="Sample questions">
          <button data-question="Why did the build fail?" type="button">Explain a build failure <span aria-hidden="true">↗</span></button>
          <button data-question="What needs attention?" type="button">Find open work <span aria-hidden="true">↗</span></button>
          <button data-question="Propose a Jira comment" type="button">Draft a Jira comment <span aria-hidden="true">↗</span></button>
        </div>
        <form id="demoForm">
          <label class="sr-only" for="demoQuestion">Your question</label>
          <textarea id="demoQuestion" rows="1" maxlength="500" placeholder="Ask about the sample project…" required></textarea>
          <button id="askButton" type="submit" aria-label="Send question">↑</button>
        </form>
        <p class="composer-note" id="demoStatus" role="status">Scripted answers · Fictional data · No real changes</p>
      </div>
    </section>
  </main>
  <footer class="wrap">
    <span>Built by <a href="https://github.com/abhijitxroy">Abhijit Roy</a></span>
    <a href="https://github.com/abhijitxroy/aimate/blob/main/docs/architecture.md">Architecture ↗</a>
  </footer>
  <noscript><p class="wrap">Enable JavaScript to try the sample demo.</p></noscript>
</body>
</html>
